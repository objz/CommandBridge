name: Support / Help
description: Ask a question or get help with CommandBridge
title: "[Support]: "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Describe your setup and what you need help with.

  - type: input
    id: version
    attributes:
      label: CommandBridge Version
      placeholder: 3.0.1
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Platform / Environment
      description: Proxy and backend software with versions
      placeholder: Velocity 3.3.0, Paper 1.21.1
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: Details
      description: Explain your question or issue. Include config or logs if relevant.
    validations:
      required: true
