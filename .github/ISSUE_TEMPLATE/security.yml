name: Security Issue
description: Report a security vulnerability in CommandBridge
labels:
  - security
body:
  - type: markdown
    attributes:
      value: |
        If this issue is sensitive, avoid posting full exploit details publicly.

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How serious is this issue?
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the vulnerability and how it can be triggered
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What can an attacker achieve?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction (Optional)
      description: Steps to reproduce, if safe to disclose
