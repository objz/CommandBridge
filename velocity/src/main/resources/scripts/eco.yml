version: 2  #the config version

name: eco-give  # the general name of the script and command. with this name the command will be registered on the target server.
description: Simple demo script that proxies /eco to a backend server #the descriptoin of the command that will be registerd. so later with help or so you can view the help message there.
enabled: true #wheter the command in genereal is enabled and will be registered or not
aliases: [ eco ]  #the aliases of the command, will be a list of

permissions:
  enabled: true  #if true checks for the user or executor if it has the right permission for it. the permission will always be: commandbridge.command.<command_name> in this case commandbridge.command.eco-give
  silent: false   # silence the failure message if the user has no permission so abort silently

defaults:
  target:
    run-as: CONSOLE  # options are CONSOLE, PLAYER, OP-PLAYER
    id: "client-1" #this is the default id that the target command will be executed on. the client id is in the clients config and the proxy is aware of it. 
                    # check if the client is even connected before doing other things otherwise abort if not connected
    #
    kind: 
      register: VELOCITY #options are VELOCITY or BACKEND
      execute: BACKEND #same options here
      # this defaults where the command will be registered and where it will be executed. both support to have the same type for example backend command will also be executed on backends.
      # this again can be overwritten also down in the commands
    
    server:
      target-required: true # if set to true, check if the target player is online on the target server if not abort. this wont affect CONSOLE executor
      schedule-online: true # if this is set to true the proxy will shedule a job that will execute the target command after the player joins the target server
      timout: 1s #the same as delay and cooldown the nuymbers will  be interpeted. this tells after what time the schedule will abort
      frequenty: 2s #will specify in what frequenty the proxy will check for if the player is online from the schudule


  delay: 0s  #specify a delay for the command that will get executed
  cooldown: 0s  #add a cooldown for the command so the user cant spam it
  #both can be set to just a number for example 1 that will be interpeted as seconds. you can leave it and make for example 60 to make one minute or just do 1m for minute. 1h for one hour and 1d for one day.



# here I would specify args that I want to implement or modify
  # for example a player argument that i call player and is type player.
  # I want to specify it because by default all arguments are not required so I will override it here by setting it to true
  # then in the command I would call it by the name for example: ${player} if I called it player. each argument will have its default values so they 
  # are not required to change anything for example if I use just world I could do ${args.WORLD} this will directly refere to the enum and the default value of it.
  # but some argument require to be overwirrten for example the RANGE because I dont want to specify a default range as this makes no sense. every argument can be overwritten tho.
  #
  # each argument if you override it will have at least these two values that are required to set: name and type. required is optional it will just use the default otherwise so false.
  # this is the list of valid types:
#  #		// Basics 
#		BOOLEAN,
#		NUMBER, // one numeric type (int/decimal)
#		WORD, // single token
#		TEXT, // supports quotes
#		GREEDY_TEXT, // rest of the line

#		// Players / entities
#		PLAYER,
#		MANY_PLAYERS,
#		ENTITY,
#		MANY_ENTITIES,

#		// World / position
#		WORLD,
#		LOCATION,

#		// Identifiers / choices
#		UUID,
#		LITERAL, // exact word
#		CHOICE, // ["start","stop"]
#		RANGE, // 0.1..10 

#		ITEM_STACK, // ItemStack
#		TIME_TICKS, // 20, 40, 200, 
#		ENCHANTMENT,
#		SOUND,
#		BIOME
  #
  #		Some types dont required any overide as told before, and written next to the type
  #		some type require additonal fields for example CHOICE.
  #		then I want fields to make this selection work of like RANGE also requires additional config fiels to configure the range
  #		others do not for example UUID or BIOME
  #		in the code I want that every argument has kinda its own struct or something like that where I can specify it there with fields to config it, if its required to override, 
  #		or add any special fields or add add error handling when some fields that are not optinal were not provided or had some invalid configs.
  #             you can define more ovverdies from the same type for example range. for example the first range has a different range then the second one. thiw will work fine but it is required to name it different
  #             also the user should be warned if he specifid a override but had overrwritten the defaults with the default values so nothing changes and it can be removed. also there should be an error if one argument comes
  #             twice so has the same name regardless if same type or not. also warn if the user has two differnt args with different names but do exactly the same


args:
  - name: player
    required: true
    type: PLAYER

  - name: amount
    required: true
    type: RANGE
    min: 1
    max: 1000

commands:
  #this here will be a list of the commands. so i can specify as much as I want. cb will go from top to the bottom like normal. 
  - command: "eco give ${player} ${amount}"
    # in the code later I will parse it, so you can put in a command with leading / or not sohuld both work. also the arguments will be parsed like told before
    # and an argument can be used muliply times. 

    # here I could override all defaults again
    # this step is optional as all values are provided in the defaults section. the defaults section is required.
    target:
      run-as: CONSOLE
      target-required: false  #overwritten
      schedule-online: false
      #here i could also overrrie the kind where to register and where to execute and so on. so i could overrride every config value theorecical that are in the defaults secion.
    delay: 2s
